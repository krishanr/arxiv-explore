# fly.toml app configuration file generated for arxiv-explore on 2026-11-25T17:18:01-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'arxiv-explore'
primary_region = 'yyz'

[build]
[env]
  UMAMI_WEBSITE_ID = '854a673f-4678-4a13-a713-dafa638ee984'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
