name: Refresh data and deploy

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit refreshed data
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Lint and test
        run: |
          uv run ruff check .
          uv run pytest -q

      - name: Refresh data from NASA ADS
        if: github.event_name != 'push'
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: uv run python -m pipeline.fetch

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Weekly data refresh"
            git push
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
